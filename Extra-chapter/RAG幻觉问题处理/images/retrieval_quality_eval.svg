<svg width="1400" height="740" viewBox="0 0 1400 740" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1400" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow2" x="0" y="0" width="1600" height="900" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#334155" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="740" fill="url(#bg2)"/>
  <text x="70" y="68" font-size="42" font-weight="700" fill="#0F172A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">第二道防线：检索质量评估</text>
  <text x="70" y="104" font-size="22" fill="#475569" font-family="'PingFang SC','Microsoft YaHei',sans-serif">核心目标：把“最相关”与“真的相关”分开</text>

  <g filter="url(#shadow2)">
    <rect x="70" y="140" rx="20" ry="20" width="1260" height="128" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <circle cx="118" cy="204" r="22" fill="#DBEAFE"/>
    <text x="118" y="212" text-anchor="middle" font-size="24" font-weight="700" fill="#1D4ED8" font-family="'PingFang SC','Microsoft YaHei',sans-serif">1</text>
    <text x="160" y="196" font-size="30" font-weight="700" fill="#1E293B" font-family="'PingFang SC','Microsoft YaHei',sans-serif">相似度分数阈值</text>
    <text x="160" y="234" font-size="24" fill="#334155" font-family="'PingFang SC','Microsoft YaHei',sans-serif">简单快速，但不同 query 分布差异大，固定阈值容易漏判或误杀</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="70" y="296" rx="20" ry="20" width="1260" height="128" fill="#FFFFFF" stroke="#86EFAC" stroke-width="2"/>
    <circle cx="118" cy="360" r="22" fill="#DCFCE7"/>
    <text x="118" y="368" text-anchor="middle" font-size="24" font-weight="700" fill="#16A34A" font-family="'PingFang SC','Microsoft YaHei',sans-serif">2</text>
    <text x="160" y="352" font-size="30" font-weight="700" fill="#1E293B" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Reranker 重排序 + 阈值校验</text>
    <text x="160" y="390" font-size="24" fill="#334155" font-family="'PingFang SC','Microsoft YaHei',sans-serif">Cross-Encoder 做精细语义匹配，分数更稳；效果更好但仍有边界 case</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="70" y="452" rx="20" ry="20" width="1260" height="172" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="2"/>
    <circle cx="118" cy="538" r="22" fill="#FCE7F3"/>
    <text x="118" y="546" text-anchor="middle" font-size="24" font-weight="700" fill="#DB2777" font-family="'PingFang SC','Microsoft YaHei',sans-serif">3</text>
    <text x="160" y="530" font-size="30" font-weight="700" fill="#1E293B" font-family="'PingFang SC','Microsoft YaHei',sans-serif">LLM 作为相关性裁判（当前方案）</text>
    <text x="160" y="568" font-size="24" fill="#334155" font-family="'PingFang SC','Microsoft YaHei',sans-serif">判断结果：SUFFICIENT / PARTIAL / IRRELEVANT</text>
    <text x="160" y="604" font-size="24" fill="#334155" font-family="'PingFang SC','Microsoft YaHei',sans-serif">据此路由：正常生成 / 附不完整提示 / 直接拒答</text>
  </g>

  <g stroke="#64748B" stroke-width="4" stroke-linecap="round">
    <line x1="700" y1="270" x2="700" y2="288"/>
    <line x1="700" y1="426" x2="700" y2="444"/>
  </g>
  <g fill="#64748B">
    <path d="M700 292 L692 280 H708 Z"/>
    <path d="M700 448 L692 436 H708 Z"/>
  </g>
</svg>
